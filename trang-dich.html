<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lấy Mã Nhận Thưởng</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen flex flex-col items-center justify-center p-4">
    <div class="bg-gray-950 p-8 rounded-2xl border border-gray-800 shadow-2xl max-w-md w-full text-center">
        <div id="icon-status" class="text-5xl mb-4 text-gray-500"><i class="fa-solid fa-spinner fa-spin"></i></div>
        <h1 id="title-status" class="text-2xl font-bold text-white mb-2">Đang kiểm tra...</h1>
        <p id="desc-status" class="text-gray-400 mb-6 text-sm">Vui lòng đợi hệ thống xác thực đường dẫn.</p>

        <div id="result-box" class="hidden p-5 bg-green-900/30 border border-green-500/50 rounded-xl">
            <p class="text-sm text-gray-300 mb-3">Thành công! Mã xác nhận của bạn là:</p>
            <p id="secret-code" class="text-xl font-mono font-bold text-green-400 break-all select-all bg-gray-900 p-3 rounded-lg border border-green-500/50 shadow-inner"></p>
            <p class="text-xs text-yellow-400 mt-3 font-medium">⚠️ Quét chọn mã trên, Copy và dán về web chính để nhận tiền!</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        const title = document.getElementById('title-status');
        const desc = document.getElementById('desc-status');
        const icon = document.getElementById('icon-status');
        const box = document.getElementById('result-box');

        setTimeout(() => {
            if(!token) {
                icon.innerHTML = `<i class="fa-solid fa-triangle-exclamation text-red-500"></i>`;
                title.innerText = "Truy cập không hợp lệ!"; title.classList.add("text-red-400");
                desc.innerText = "Bạn chưa đi qua link rút gọn. Vui lòng quay lại web chính và bấm làm nhiệm vụ để hệ thống cấp link!";
            } else {
                icon.innerHTML = `<i class="fa-solid fa-shield-check text-green-500"></i>`;
                title.innerText = "Xác Thực Thành Công"; title.classList.add("text-green-400");
                desc.innerText = "Cảm ơn bạn đã hoàn thành nhiệm vụ vượt link.";
                document.getElementById('secret-code').innerText = token;
                box.classList.remove('hidden');
            }
        }, 800);
    </script>
</body>
</html>
