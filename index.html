<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chéo Chém Giá - Auto Link4m</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script>
        // BẬT CHẾ ĐỘ DARK MODE CHO TAILWIND
        tailwind.config = { darkMode: 'class' }
    </script>

    <style>
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #06b6d4; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .modal-bg { background-color: rgba(0, 0, 0, 0.6); backdrop-filter: blur(5px); }
        /* Ẩn thanh cuộn nhưng vẫn cuộn được */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-950 text-gray-800 dark:text-gray-200 min-h-screen font-sans flex flex-col transition-colors duration-300">

    <script>
        // ĐIỀN LINK APP SCRIPT VÀ TÊN TÀI KHOẢN ADMIN VÀO ĐÂY
        const API_URL = "https://script.google.com/macros/s/AKfycbyHVpnGTom-05eQ-KOGqohCKdnOUgVvekk2e5AZx57JPhw6YGfQSvCMcFSb3OQl8YwelQ/exec";
        const ADMIN_USERNAME = "admin"; // Điền tên tài khoản chủ web của bạn vào đây
    </script>

    <!-- HEADER -->
    <nav class="bg-white dark:bg-gray-900 border-b border-gray-300 dark:border-gray-800 p-3 sm:p-4 sticky top-0 z-50 shadow-md transition-colors">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <!-- LOGO -->
            <div class="text-xl sm:text-2xl font-bold bg-gradient-to-r from-cyan-500 to-blue-600 bg-clip-text text-transparent cursor-pointer" onclick="switchTab('home')">
                <i class="fa-solid fa-bolt text-cyan-500"></i> Chéo Chém Giá
            </div>
            
            <!-- MENU DESKTOP (Ẩn trên điện thoại) -->
            <div id="nav-menu" class="hidden md:flex items-center gap-6 text-sm lg:text-base font-semibold absolute left-1/2 transform -translate-x-1/2">
                <button onclick="switchTab('home')" class="nav-btn text-cyan-500"><i class="fa-solid fa-list-check"></i> Nhiệm vụ</button>
                <button onclick="switchTab('post')" class="nav-btn text-gray-500 dark:text-gray-400 hover:text-cyan-500"><i class="fa-solid fa-plus-circle"></i> Đăng Link</button>
                <button onclick="switchTab('history')" class="nav-btn text-gray-500 dark:text-gray-400 hover:text-cyan-500"><i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử</button>
                <button onclick="switchTab('leaderboard')" class="nav-btn text-gray-500 dark:text-gray-400 hover:text-cyan-500"><i class="fa-solid fa-trophy"></i> BXH</button>
                <button onclick="switchTab('profile')" class="nav-btn text-gray-500 dark:text-gray-400 hover:text-cyan-500"><i class="fa-solid fa-user-gear"></i> Cá Nhân</button>
            </div>

            <!-- TIỀN & GIAO DIỆN SÁNG TỐI (Luôn hiện) -->

    <!-- CONTENT VÙNG CHÍNH (Thêm pb-20 để không bị lấp bởi menu điện thoại) -->

        <!-- ĐĂNG NHẬP -->
        <div id="tab-auth" class="tab-content active max-w-md mx-auto mt-4 sm:mt-10">

                </div>
                
                <input id="auth-username" type="text" placeholder="Tên tài khoản..." class="w-full bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:border-cyan-500">
                <input id="auth-password" type="password" placeholder="Mật khẩu..." class="w-full bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 mb-4 focus:outline-none focus:border-cyan-500">

                <div id="remember-container" class="flex items-center mb-6 px-1">

                    <label for="auth-remember" class="ml-2 text-sm font-medium text-gray-700 dark:text-gray-300 cursor-pointer">Lưu phiên đăng nhập</label>
                </div>

                <button id="btn-auth" onclick="handleAuth()" class="w-full bg-cyan-500 text-white font-bold py-3 rounded-lg hover:bg-cyan-600 shadow-md">Bắt đầu</button>
            </div>
        </div>

        <!-- NHIỆM VỤ -->
        <div id="tab-home" class="tab-content">
            <div class="flex justify-between items-center mb-6 border-b border-gray-300 dark:border-gray-800 pb-4">
                <h1 class="text-2xl sm:text-3xl font-bold">Nhiệm Vụ</h1>
                <button onclick="fetchData()" class="bg-gray-200 dark:bg-gray-800 text-cyan-600 dark:text-cyan-400 px-3 py-1.5 sm:px-4 sm:py-2 rounded-lg font-bold text-sm sm:text-base"><i class="fa-solid fa-rotate-right mr-1"></i> Làm mới</button>
            </div>
            <div class="flex gap-2 sm:gap-3 mb-6 overflow-x-auto pb-2 hide-scrollbar whitespace-nowrap">

                <button id="btn-type-tim" onclick="filterTasks('cheo_tim')" class="nav-task-btn bg-white dark:bg-gray-900 text-gray-500 font-bold px-4 sm:px-5 py-2 rounded-lg border border-gray-200 dark:border-gray-800 text-sm sm:text-base">Tăng Tim</button>

        <!-- ĐĂNG LINK -->

            <div class="bg-white dark:bg-gray-900 rounded-2xl p-5 sm:p-6 border border-gray-200 dark:border-gray-800 shadow-xl">

                <div class="space-y-4 sm:space-y-5">
                    <div>

                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Đường link (Tùy chọn cho Vượt Link)</label>

                    </div>
                    <div>
                        <label class="block text-sm font-semibold mb-2">Số lượt cần</label>

            <div class="bg-white dark:bg-gray-900 rounded-2xl p-4 sm:p-6 border border-gray-200 dark:border-gray-800 shadow-xl">
                <div id="leaderboard-container" class="space-y-3"></div>

        </div>

        <!-- LỊCH SỬ -->

            <div class="bg-white dark:bg-gray-900 rounded-2xl p-4 sm:p-6 border border-gray-200 dark:border-gray-800 shadow-xl max-w-3xl mx-auto">

        <!-- CÁ NHÂN & ĐỔI MẬT KHẨU -->

            <div class="bg-white dark:bg-gray-900 rounded-2xl p-5 sm:p-6 border border-gray-200 dark:border-gray-800 shadow-xl mb-4 sm:mb-6 flex items-center gap-4 sm:gap-6">
                <div class="w-16 h-16 sm:w-20 sm:h-20 bg-cyan-500 rounded-full flex items-center justify-center text-3xl sm:text-4xl text-white shadow-lg">
                    <i class="fa-solid fa-user"></i>
                </div>
                <div>
                    <h2 id="profile-name" class="text-xl sm:text-2xl font-bold mb-1">Guest</h2>
                    <div class="font-bold text-orange-500 dark:text-yellow-400 text-base sm:text-lg"><i class="fa-solid fa-wallet mr-2"></i><span id="profile-chem">0</span> VNĐ</div>

            <div class="bg-white dark:bg-gray-900 rounded-2xl p-5 sm:p-6 border border-gray-200 dark:border-gray-800 shadow-xl mb-4 sm:mb-6">

                <div class="space-y-4">
                    <input id="pwd-old" type="password" placeholder="Mật khẩu hiện tại" class="w-full bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 focus:border-cyan-500">
                    <input id="pwd-new" type="password" placeholder="Mật khẩu mới" class="w-full bg-gray-50 dark:bg-gray-950 border border-gray-300 dark:border-gray-700 rounded-lg px-4 py-3 focus:border-cyan-500">
                    <button onclick="changePassword()" class="w-full bg-gray-800 dark:bg-gray-700 hover:bg-gray-900 text-white font-bold py-3 rounded-lg transition-colors">Lưu Mật Khẩu</button>

            <!-- NÚT ĐĂNG XUẤT ĐƯỢC CHUYỂN VÀO ĐÂY -->

    <!-- MENU ĐIỆN THOẠI BOTTOM NAVIGATION (Chỉ hiện trên mobile) -->
    <div id="mobile-nav" class="hidden md:hidden fixed bottom-0 left-0 right-0 bg-white dark:bg-gray-900 border-t border-gray-300 dark:border-gray-800 flex justify-between px-2 sm:px-4 pb-safe pt-1 z-50 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] dark:shadow-[0_-2px_10px_rgba(0,0,0,0.2)]">
        <button onclick="switchTab('home')" class="nav-btn-mobile flex-1 flex flex-col items-center p-2 text-cyan-500">
            <i class="fa-solid fa-list-check text-lg mb-1"></i><span class="text-[10px] sm:text-xs font-semibold">Nhiệm vụ</span>
        </button>
        <button onclick="switchTab('post')" class="nav-btn-mobile flex-1 flex flex-col items-center p-2 text-gray-500 dark:text-gray-400 hover:text-cyan-500">
            <i class="fa-solid fa-plus-circle text-lg mb-1"></i><span class="text-[10px] sm:text-xs font-semibold">Đăng</span>
        </button>
        <button onclick="switchTab('history')" class="nav-btn-mobile flex-1 flex flex-col items-center p-2 text-gray-500 dark:text-gray-400 hover:text-cyan-500">
            <i class="fa-solid fa-clock-rotate-left text-lg mb-1"></i><span class="text-[10px] sm:text-xs font-semibold">Lịch sử</span>
        </button>
        <button onclick="switchTab('leaderboard')" class="nav-btn-mobile flex-1 flex flex-col items-center p-2 text-gray-500 dark:text-gray-400 hover:text-cyan-500">
            <i class="fa-solid fa-trophy text-lg mb-1"></i><span class="text-[10px] sm:text-xs font-semibold">BXH</span>
        </button>
        <button onclick="switchTab('profile')" class="nav-btn-mobile flex-1 flex flex-col items-center p-2 text-gray-500 dark:text-gray-400 hover:text-cyan-500">
            <i class="fa-solid fa-user-gear text-lg mb-1"></i><span class="text-[10px] sm:text-xs font-semibold">Cá nhân</span>
        </button>
    </div>

    <!-- POPUP BÁO CÁO NHIỆM VỤ -->
    <div id="modal-verify" class="fixed inset-0 modal-bg z-[100] hidden flex items-center justify-center px-4">
        <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 p-6 sm:p-8 rounded-2xl max-w-md w-full shadow-2xl relative">
            <button onclick="closeVerifyModal()" class="absolute top-4 right-4 text-gray-500 hover:text-gray-800 dark:hover:text-white text-xl sm:text-2xl"><i class="fa-solid fa-times"></i></button>
            <h3 class="text-lg sm:text-xl font-bold mb-2"><i class="fa-solid fa-shield-halved text-cyan-500 mr-2"></i> Xác Nhận Nhiệm Vụ</h3>
            <p class="text-gray-600 dark:text-gray-400 mb-5 sm:mb-6 text-sm" id="verify-desc">...</p>
            <input id="verify-input" type="text" class="w-full bg-gray-50 dark:bg-gray-950 border border-cyan-500 rounded-lg px-4 py-3 sm:py-4 text-base sm:text-lg mb-5 sm:mb-6 outline-none" placeholder="Nhập mã tại đây...">
            <button id="btn-submit-verify" onclick="submitVerify()" class="w-full bg-green-500 hover:bg-green-600 text-white font-bold py-3 sm:py-4 rounded-lg transition-transform">
                Gửi Báo Cáo
            </button>
        </div>
    </div>

    <script>
        let currentUser = null; let allTasks = []; let myPostedTasks = []; let myHistory = []; let leaderboardData = [];
        let currentTaskType = 'vuot_link'; let authMode = 'login'; 
        let activeTaskId = null; let activeTaskType = null;

        // KIỂM TRA CHẾ ĐỘ SÁNG/TỐI LÚC TẢI TRANG
        if (localStorage.getItem('theme') === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
            document.getElementById('theme-btn').innerHTML = '<i class="fa-solid fa-sun text-yellow-500"></i>';
        } else {
            document.documentElement.classList.remove('dark');
            document.getElementById('theme-btn').innerHTML = '<i class="fa-solid fa-moon text-gray-600"></i>';
        }

        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            const isDark = document.documentElement.classList.contains('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            document.getElementById('theme-btn').innerHTML = isDark ? '<i class="fa-solid fa-sun text-yellow-500"></i>' : '<i class="fa-solid fa-moon text-gray-600"></i>';
        }

        window.onload = () => {
            // Kiểm tra cả localStorage và sessionStorage
            const saved = localStorage.getItem('ccg_user') || sessionStorage.getItem('ccg_user');
            if(saved) { 
                currentUser = JSON.parse(saved); 
                updateUI(); 
                switchTab('home'); 
                fetchData(); 
                setupPostTaskForm(); 
            }
        };

        function showToast(msg, type="success") { Toastify({ text: msg, duration: 3000, gravity: "top", position: "right", style: { background: type==="success" ? "#059669" : "#e11d48", borderRadius: "8px", fontWeight: "bold" } }).showToast(); }

        async function apiCall(action, payload) {
            try { const res = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action, ...payload }) }); return await res.json(); } 
            catch(e) { showToast("Lỗi kết nối máy chủ!", "error"); return null; }
        }

        function updateUI() {
            if(currentUser) {
                document.getElementById('nav-menu').classList.replace('hidden', 'md:flex'); // Hiện menu desktop
                document.getElementById('mobile-nav').classList.replace('hidden', 'flex'); // Hiện menu mobile
                document.getElementById('user-balance').classList.remove('hidden'); // Hiện số dư tiền
                
                document.getElementById('nav-chem').innerText = currentUser.chem.toLocaleString();
                document.getElementById('profile-name').innerText = currentUser.username;
                document.getElementById('profile-chem').innerText = currentUser.chem.toLocaleString();
                setupPostTaskForm();
            } else { 
                document.getElementById('nav-menu').classList.replace('md:flex', 'hidden');
                document.getElementById('mobile-nav').classList.replace('flex', 'hidden');
                document.getElementById('user-balance').classList.add('hidden');
            }
        }

        function switchTab(tab) {
            // Ẩn tất cả tab
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            // Reset màu Desktop Menu
            document.querySelectorAll('.nav-btn').forEach(b => b.className = "nav-btn text-gray-500 dark:text-gray-400 hover:text-cyan-500 font-semibold transition-colors");
            // Reset màu Mobile Menu
            document.querySelectorAll('.nav-btn-mobile').forEach(b => b.className = "nav-btn-mobile flex-1 flex flex-col items-center p-2 text-gray-500 dark:text-gray-400 hover:text-cyan-500 transition-colors");
            
            if(tab !== 'auth') {
                // Đổi màu menu đang chọn (Desktop)
                const dBtn = document.querySelector(`.nav-btn[onclick="switchTab('${tab}')"]`);
                if(dBtn) dBtn.className = "nav-btn text-cyan-500 font-semibold";
                
                // Đổi màu menu đang chọn (Mobile)
                const mBtn = document.querySelector(`.nav-btn-mobile[onclick="switchTab('${tab}')"]`);
                if(mBtn) mBtn.className = "nav-btn-mobile flex-1 flex flex-col items-center p-2 text-cyan-500 transition-colors";
            }
            
            // Cuộn lên đầu trang khi chuyển tab
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleAuth(mode) {
            authMode = mode;
            document.getElementById('btn-show-login').className = mode === 'login' ? "px-4 py-2 border-b-2 border-cyan-500 text-cyan-500 font-bold transition-colors" : "px-4 py-2 text-gray-500 font-bold border-b-2 border-transparent transition-colors";
            document.getElementById('btn-show-register').className = mode === 'register' ? "px-4 py-2 border-b-2 border-cyan-500 text-cyan-500 font-bold transition-colors" : "px-4 py-2 text-gray-500 font-bold border-b-2 border-transparent transition-colors";
            
            // Ẩn nút "Lưu đăng nhập" nếu ở chế độ đăng ký
            document.getElementById('remember-container').style.display = mode === 'login' ? 'flex' : 'none';
        }

        async function handleAuth() {
            const u = document.getElementById('auth-username').value.trim();
            const p = document.getElementById('auth-password').value.trim();
            if(!u || !p) return showToast("Nhập đủ thông tin!", "error");
            
            document.getElementById('btn-auth').innerHTML = `<span class="loader"></span>`;
            const res = await apiCall(authMode, { username: u, password: p });
            
            if(res && res.success) {
                currentUser = res.user; 
                
                // Xử lý lưu phiên đăng nhập
                const remember = document.getElementById('auth-remember').checked;
                if(remember && authMode === 'login') {
                    localStorage.setItem('ccg_user', JSON.stringify(currentUser));
                    sessionStorage.removeItem('ccg_user');
                } else {
                    sessionStorage.setItem('ccg_user', JSON.stringify(currentUser));
                    localStorage.removeItem('ccg_user');
                }

                showToast(res.message); 
                updateUI(); 
                switchTab('home'); 
                fetchData();
            } else { showToast(res.message, "error"); }
            document.getElementById('btn-auth').innerHTML = `Bắt đầu`;
        }

        function logout() { 
            localStorage.removeItem('ccg_user'); 
            sessionStorage.removeItem('ccg_user');
            currentUser = null; 
            document.getElementById('auth-password').value = '';
            switchTab('auth'); 
            updateUI(); 
        }

        async function fetchData() {
            const res = await apiCall('get_data', { username: currentUser.username });
            if(res && res.success) { 
                allTasks = res.tasks; myHistory = res.history; leaderboardData = res.leaderboard; 
                filterTasks(currentTaskType); renderHistory(); renderLeaderboard();
            }
        }

        function setupPostTaskForm() {
            if(!currentUser) return;
            const select = document.getElementById('post-type');
            let options = `
                <option value="cheo_chem">Chéo Chém Giá - Giá: 150 VNĐ/lượt</option>
                <option value="cheo_tim">Tăng Tim (Like) - Giá: 200 VNĐ/lượt</option>
                <option value="cheo_follow">Tăng Follow - Giá: 300 VNĐ/lượt</option>
            `;
            if(currentUser.username === ADMIN_USERNAME) {
                options = `<option value="vuot_link">Vượt Link - MIỄN PHÍ (Chỉ Admin)</option>` + options;
            }
            select.innerHTML = options;
            calcCost();
        }

        function filterTasks(type) {
            currentTaskType = type;
            const btnActive = "nav-task-btn bg-cyan-100 dark:bg-cyan-500/20 text-cyan-600 dark:text-cyan-400 font-bold px-4 sm:px-5 py-2 rounded-lg border border-cyan-300 dark:border-cyan-500/50 text-sm sm:text-base";
            const btnInactive = "nav-task-btn bg-white dark:bg-gray-900 text-gray-500 font-bold px-4 sm:px-5 py-2 rounded-lg border border-gray-200 dark:border-gray-800 hover:bg-gray-50 text-sm sm:text-base transition-colors";
            
            document.getElementById('btn-type-vuot').className = type === 'vuot_link' ? btnActive : btnInactive;
            document.getElementById('btn-type-chem').className = type === 'cheo_chem' ? btnActive : btnInactive;
            document.getElementById('btn-type-tim').className = type === 'cheo_tim' ? btnActive : btnInactive;
            document.getElementById('btn-type-follow').className = type === 'cheo_follow' ? btnActive : btnInactive;
            
            const list = document.getElementById('tasks-container');
            const filtered = allTasks.filter(t => t.type === type && t.current < t.target && t.creator !== currentUser.username);
            
            if(filtered.length === 0) { list.innerHTML = `<div class="col-span-full text-center text-gray-500 py-10 italic">Hiện chưa có nhiệm vụ nào!</div>`; return; }

            list.innerHTML = filtered.map(t => `
                <div class="bg-white dark:bg-gray-900 border border-gray-200 dark:border-gray-800 rounded-xl p-4 sm:p-5 shadow-md flex flex-col h-full justify-between">
                    <div>
                        <div class="text-xs text-gray-500 mb-1">ID: ${t.id}</div>
                        <div class="truncate text-sm font-semibold text-blue-600 dark:text-cyan-400 mb-4" title="${t.url}">${t.type === 'vuot_link' ? 'Vượt link Link4m (Tự động)' : t.url}</div>
                        <div class="flex justify-between items-center mb-4">
                            <span class="bg-orange-100 dark:bg-yellow-500/20 text-orange-600 dark:text-yellow-400 px-2 py-1 rounded text-xs sm:text-sm font-bold">+${t.reward} đ</span>
                            <span class="text-xs text-gray-500 bg-gray-100 dark:bg-gray-950 px-2 py-1 rounded">Đã làm: ${t.current}/${t.target}</span>
                        </div>
                    </div>
                    <button onclick="startTaskVerify('${t.id}', '${t.url}', '${t.type}', event)" class="w-full bg-gray-100 dark:bg-white text-gray-800 dark:text-black font-bold py-2 sm:py-3 rounded-lg hover:bg-gray-200 transition-colors text-sm sm:text-base">
                        Làm & Báo Cáo
                    </button>
                </div>
            `).join('');
        }

        function calcCost() {
            const type = document.getElementById('post-type').value;
            let cost = 150;
            if (type === 'cheo_tim') cost = 200;
            if (type === 'cheo_follow') cost = 300;
            if (type === 'vuot_link') cost = 0; 

            const views = document.getElementById('post-views').value;
            document.getElementById('post-total').innerText = (cost === 0 ? "MIỄN PHÍ" : `- ${(views * cost).toLocaleString()} VNĐ`);
        }

        async function postTask() {
            const type = document.getElementById('post-type').value;
            const url = document.getElementById('post-url').value.trim();
            const views = document.getElementById('post-views').value;
            
            let costPerView = 150; let rewardPerView = 100;
            if (type === 'cheo_tim') { costPerView = 200; rewardPerView = 150; }
            if (type === 'cheo_follow') { costPerView = 300; rewardPerView = 200; }
            if (type === 'vuot_link') { costPerView = 0; rewardPerView = 100; }

            const totalCost = views * costPerView;
            if(type !== 'vuot_link' && !url) return showToast("Cần nhập URL!", "error");

            const btn = document.getElementById('btn-post-task');
            btn.innerHTML = `<span class="loader"></span>`;
            
            const res = await apiCall('post_task', { username: currentUser.username, taskType: type, url: url || "Vượt Link (Auto)", views, costPerView, rewardPerView, totalCost });
            if(res && res.success) {
                showToast("Đăng nhiệm vụ thành công!");
                currentUser.chem = res.newChem; 
                if(localStorage.getItem('ccg_user')) localStorage.setItem('ccg_user', JSON.stringify(currentUser));
                else sessionStorage.setItem('ccg_user', JSON.stringify(currentUser));
                updateUI(); fetchData(); switchTab('home');
            } else { showToast(res.message, "error"); }
            btn.innerHTML = `Thanh toán & Đăng`;
        }

        async function startTaskVerify(taskId, url, type, event) {
            activeTaskId = taskId; activeTaskType = type;
            if (type === 'vuot_link') {
                const btn = event.currentTarget; const originalText = btn.innerHTML;
                btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-1"></i> Đang tạo...`; btn.disabled = true;
                const res = await apiCall('get_shortlink', { username: currentUser.username, taskId: taskId });
                btn.innerHTML = originalText; btn.disabled = false;
                if(res && res.success) {
                    window.open(res.shortUrl, '_blank');
                    const modal = document.getElementById('modal-verify');
                    document.getElementById('verify-desc').innerHTML = `Đã mở Tab mới. Hãy vượt qua quảng cáo để lấy mã Token và dán vào đây!`;
                    document.getElementById('verify-input').value = '';
                    modal.classList.remove('hidden');
                } else { showToast("Lỗi tạo link!", "error"); }
            } else {
                window.open(url, '_blank');
                const modal = document.getElementById('modal-verify');
                document.getElementById('verify-desc').innerHTML = "Nhập chính xác ID/Username bạn vừa dùng để tương tác.";
                document.getElementById('verify-input').value = '';
                modal.classList.remove('hidden');
            }
        }

        function closeVerifyModal() { document.getElementById('modal-verify').classList.add('hidden'); }

        async function submitVerify() {
            const verifyData = document.getElementById('verify-input').value.trim();
            if (!verifyData) return showToast("Chưa nhập thông tin!", "error");
            
            const btn = document.getElementById('btn-submit-verify');
            const originalText = btn.innerHTML;
            btn.innerHTML = `<span class="loader"></span>`; btn.disabled = true;

            const res = await apiCall('submit_task', { username: currentUser.username, taskId: activeTaskId, taskType: activeTaskType, verifyData: verifyData });
            
            if(res && res.success) {
                showToast(res.message);
                if(res.newChem) { 
                    currentUser.chem = res.newChem; 
                    if(localStorage.getItem('ccg_user')) localStorage.setItem('ccg_user', JSON.stringify(currentUser));
                    else sessionStorage.setItem('ccg_user', JSON.stringify(currentUser));
                    updateUI(); 
                }
                closeVerifyModal(); fetchData();
            } else { showToast(res.message, "error"); }
            btn.innerHTML = originalText; btn.disabled = false;
        };

        async function changePassword() {
            const oldP = document.getElementById('pwd-old').value;
            const newP = document.getElementById('pwd-new').value;
            if(!oldP || !newP) return showToast("Nhập đủ mật khẩu!", "error");
            
            const res = await apiCall('change_password', { username: currentUser.username, oldPassword: oldP, newPassword: newP });
            if(res && res.success) {
                showToast(res.message); document.getElementById('pwd-old').value = ''; document.getElementById('pwd-new').value = '';
            } else { showToast(res.message, "error"); }
        }

        function renderHistory() {
            const box = document.getElementById('history-done');
            box.innerHTML = myHistory.length === 0 ? '<p class="text-gray-500">Chưa có dữ liệu.</p>' : myHistory.reverse().map(h => `
                <div class="bg-gray-50 dark:bg-gray-950 p-3 sm:p-4 rounded-lg border border-gray-200 dark:border-gray-800 flex justify-between items-center">
                    <div>
                        <div class="text-[10px] sm:text-xs text-gray-500">${h.time}</div>
                        <div class="text-xs sm:text-sm font-semibold text-blue-600 dark:text-cyan-400">ID: ${h.target}</div>
                    </div>
                    <span class="text-[10px] sm:text-xs font-bold px-2 py-1 rounded ${h.status === 'approved' ? 'bg-green-100 text-green-600 dark:bg-green-900/30 dark:text-green-400' : 'bg-yellow-100 text-yellow-600 dark:bg-yellow-900/30 dark:text-yellow-400'}">${h.status === 'approved' ? 'Hoàn thành' : 'Chờ duyệt'}</span>
                </div>
            `).join('');
        }

        function renderLeaderboard() {
            const box = document.getElementById('leaderboard-container');
            if(leaderboardData.length === 0) { box.innerHTML = '<p class="text-gray-500">Chưa có dữ liệu.</p>'; return; }
            
            let html = '';
            leaderboardData.forEach((user, index) => {
                let medal = '';
                if(index === 0) medal = '<i class="fa-solid fa-medal text-yellow-500 text-xl sm:text-2xl"></i>';
                else if(index === 1) medal = '<i class="fa-solid fa-medal text-gray-400 text-lg sm:text-xl"></i>';
                else if(index === 2) medal = '<i class="fa-solid fa-medal text-orange-600 text-base sm:text-lg"></i>';
                else medal = `<span class="text-gray-400 font-bold w-6 text-center text-sm sm:text-base">${index + 1}</span>`;

                html += `
                <div class="bg-gray-50 dark:bg-gray-950 p-3 sm:p-4 rounded-lg border border-gray-200 dark:border-gray-800 flex justify-between items-center hover:scale-[1.01] transition-transform cursor-default">
                    <div class="flex items-center gap-3 sm:gap-4">
                        <div class="w-6 sm:w-8 flex justify-center">${medal}</div>
                        <div class="font-bold text-sm sm:text-lg ${index === 0 ? 'text-yellow-500' : ''}">${user.username}</div>
                    </div>
                    <div class="font-bold text-sm sm:text-base text-orange-500 dark:text-yellow-400">${user.chem.toLocaleString()} đ</div>
                </div>`;
            });
            box.innerHTML = html;
        }
    </script>
</body>
</html>
