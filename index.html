<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chéo Chém Giá - Vượt Link & Trao Đổi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <style>
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .modal-bg { background-color: rgba(0, 0, 0, 0.8); backdrop-filter: blur(5px); }
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #06b6d4; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-950 text-gray-200 min-h-screen font-sans flex flex-col">

    <!-- CẤU HÌNH API Ở ĐÂY -->
    <script>
        // DÁN LINK GOOGLE APPS SCRIPT CỦA BẠN XUỐNG DÒNG DƯỚI NÀY
        const API_URL = "https://script.google.com/macros/s/AKfycbyHVpnGTom-05eQ-KOGqohCKdnOUgVvekk2e5AZx57JPhw6YGfQSvCMcFSb3OQl8YwelQ/exec";
    </script>

    <!-- NAVBAR -->
    <nav class="bg-gray-900 border-b border-gray-800 text-white p-4 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="text-2xl font-bold bg-gradient-to-r from-cyan-400 to-purple-500 bg-clip-text text-transparent cursor-pointer">
                <i class="fa-solid fa-bolt text-cyan-400"></i> Chéo Chém Giá
            </div>
            
            <div id="nav-menu" class="hidden md:flex items-center gap-6">
                <button onclick="switchTab('home')" class="nav-btn font-medium text-cyan-400"><i class="fa-solid fa-list-check"></i> Nhiệm vụ</button>
                <button onclick="switchTab('post')" class="nav-btn font-medium text-gray-400"><i class="fa-solid fa-plus-circle"></i> Đăng Link</button>
                <button onclick="switchTab('profile')" class="nav-btn font-medium text-gray-400"><i class="fa-solid fa-clock-rotate-left"></i> Lịch Sử</button>
                
                <div class="bg-gray-800 px-4 py-2 rounded-full flex items-center gap-2 border border-gray-700">
                    <span class="text-xs text-gray-400 mr-2">(300đ = 1⚡)</span>
                    <i class="fa-solid fa-bolt text-yellow-400"></i>
                    <span id="nav-chem" class="font-bold text-yellow-400">0</span>
                </div>
                <button onclick="logout()" class="text-red-400 hover:text-red-300 ml-2" title="Đăng xuất"><i class="fa-solid fa-right-from-bracket"></i></button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-6xl mx-auto py-8 px-4 w-full">
        
        <!-- TRANG ĐĂNG NHẬP / ĐĂNG KÝ -->
        <div id="tab-auth" class="tab-content active max-w-md mx-auto mt-10">
            <div class="bg-gray-900 rounded-2xl p-8 border border-gray-800 shadow-2xl">
                <div class="flex justify-center mb-6">
                    <button id="btn-show-login" onclick="toggleAuth('login')" class="px-4 py-2 border-b-2 border-cyan-400 text-cyan-400 font-bold">Đăng Nhập</button>
                    <button id="btn-show-register" onclick="toggleAuth('register')" class="px-4 py-2 border-b-2 border-transparent text-gray-500 font-bold hover:text-gray-300">Đăng Ký</button>
                </div>
                
                <input id="auth-username" type="text" placeholder="Tên tài khoản..." class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-cyan-500 mb-4">
                <input id="auth-password" type="password" placeholder="Mật khẩu..." class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-white focus:border-cyan-500 mb-6">
                
                <button id="btn-auth" onclick="handleAuth()" class="w-full bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-bold py-3 rounded-lg flex justify-center items-center gap-2">
                    <i class="fa-solid fa-right-to-bracket"></i> Bắt đầu
                </button>
            </div>
        </div>

        <!-- TRANG CHỦ: DANH SÁCH NHIỆM VỤ -->
        <div id="tab-home" class="tab-content">
            <div class="flex justify-between items-end mb-6">
                <h1 class="text-3xl font-bold text-white">Nhiệm Vụ</h1>
                <button onclick="fetchData()" class="text-cyan-400 hover:text-cyan-300"><i class="fa-solid fa-rotate-right"></i> Làm mới</button>
            </div>

            <!-- Nút chia 2 loại nhiệm vụ -->
            <div class="flex gap-4 mb-6 border-b border-gray-800 pb-2">
                <button id="btn-type-vuot" onclick="filterTasks('vuot_link')" class="text-cyan-400 font-bold text-lg px-2"><i class="fa-solid fa-link"></i> Vượt Link (Hệ thống)</button>
                <button id="btn-type-cheo" onclick="filterTasks('cheo_link')" class="text-gray-500 font-bold text-lg px-2 hover:text-gray-300"><i class="fa-solid fa-handshake"></i> Chéo Link (Người dùng)</button>
            </div>

            <div id="tasks-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                <!-- Dữ liệu render bằng JS -->
            </div>
        </div>

        <!-- TRANG ĐĂNG LINK (MUA CHÉO) -->
        <div id="tab-post" class="tab-content max-w-xl mx-auto">
            <div class="bg-gray-900 rounded-2xl p-6 border border-gray-800 shadow-xl">
                <h2 class="text-2xl font-bold text-white mb-6"><i class="fa-solid fa-paper-plane text-purple-400"></i> Đăng Link Chéo</h2>
                <div class="space-y-5">
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Link cần tương tác</label>
                        <input id="post-url" type="text" placeholder="https://..." class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-white">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-400 mb-2">Số lượt cần (Người khác làm cho bạn)</label>
                        <input id="post-views" type="number" min="10" value="10" oninput="calcCost()" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-white">
                    </div>
                    <div class="bg-gray-950 p-4 rounded-lg border border-gray-800">
                        <div class="flex justify-between mb-2 text-gray-400"><span>Giá 1 lượt chéo:</span> <span class="text-white">2 ⚡</span></div>
                        <div class="flex justify-between border-t border-gray-800 pt-3 mt-2 font-bold">
                            <span>Tổng phí:</span> <span id="post-total" class="text-yellow-400">- 20 ⚡</span>
                        </div>
                    </div>
                    <button id="btn-post-task" onclick="postTask()" class="w-full bg-gradient-to-r from-cyan-500 to-purple-600 text-white font-bold py-4 rounded-lg">
                        Thanh toán & Đăng
                    </button>
                </div>
            </div>
        </div>

        <!-- TRANG LỊCH SỬ -->
        <div id="tab-profile" class="tab-content">
            <h2 class="text-2xl font-bold text-white mb-6"><i class="fa-solid fa-clock-rotate-left"></i> Quản Lý Cá Nhân</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                <!-- Lịch sử làm nhiệm vụ -->
                <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
                    <h3 class="text-lg font-bold text-cyan-400 mb-4 border-b border-gray-800 pb-2">Lịch sử làm (Chờ duyệt)</h3>
                    <div id="history-done" class="space-y-3 max-h-96 overflow-y-auto"></div>
                </div>

                <!-- Lịch sử mua/đăng -->
                <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
                    <h3 class="text-lg font-bold text-purple-400 mb-4 border-b border-gray-800 pb-2">Lịch sử đăng link</h3>
                    <div id="history-post" class="space-y-3 max-h-96 overflow-y-auto"></div>
                </div>
            </div>
        </div>
    </main>

    <!-- KỊCH BẢN JAVASCRIPT -->
    <script>
        let currentUser = null;
        let allTasks = [];
        let myHistory = [];
        let currentTaskType = 'vuot_link'; 
        let authMode = 'login'; 

        // Khởi tạo
        window.onload = () => {
            const saved = localStorage.getItem('ccg_user');
            if(saved) {
                currentUser = JSON.parse(saved);
                updateUI();
                switchTab('home');
                fetchData();
            }
        };

        function showToast(msg, type="success") {
            Toastify({ text: msg, duration: 3000, gravity: "bottom", position: "right",
                style: { background: type==="success" ? "#059669" : "#e11d48", borderRadius: "8px" }
            }).showToast();
        }

        async function apiCall(action, payload) {
            if(API_URL.includes("DÁN_LINK")) {
                showToast("Bạn chưa cài đặt API Google Sheets!", "error");
                return null;
            }
            try {
                const res = await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action, ...payload })
                });
                return await res.json();
            } catch(e) {
                showToast("Lỗi kết nối máy chủ!", "error");
                return null;
            }
        }

        function updateUI() {
            if(currentUser) {
                document.getElementById('nav-menu').classList.remove('hidden');
                document.getElementById('nav-chem').innerText = currentUser.chem;
            } else {
                document.getElementById('nav-menu').classList.add('hidden');
            }
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(`tab-${tab}`).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.className = "nav-btn font-medium text-gray-400");
            if(tab !== 'auth') {
                const btn = document.querySelector(`button[onclick="switchTab('${tab}')"]`);
                if(btn) btn.className = "nav-btn font-medium text-cyan-400";
            }
        }

        // --- AUTH ---
        function toggleAuth(mode) {
            authMode = mode;
            document.getElementById('btn-show-login').className = mode === 'login' ? "px-4 py-2 border-b-2 border-cyan-400 text-cyan-400 font-bold" : "px-4 py-2 border-b-2 border-transparent text-gray-500 font-bold";
            document.getElementById('btn-show-register').className = mode === 'register' ? "px-4 py-2 border-b-2 border-cyan-400 text-cyan-400 font-bold" : "px-4 py-2 border-b-2 border-transparent text-gray-500 font-bold";
        }

        async function handleAuth() {
            const u = document.getElementById('auth-username').value;
            const p = document.getElementById('auth-password').value;
            if(!u || !p) return showToast("Nhập đủ thông tin!", "error");

            const btn = document.getElementById('btn-auth');
            btn.innerHTML = `<span class="loader"></span> Đang xử lý...`;
            
            const res = await apiCall(authMode, { username: u, password: p });
            if(res && res.success) {
                currentUser = res.user;
                localStorage.setItem('ccg_user', JSON.stringify(currentUser));
                showToast(res.message || "Thành công!");
                updateUI();
                switchTab('home');
                fetchData();
            } else if(res) {
                showToast(res.message, "error");
            }
            btn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Bắt đầu`;
        }

        function logout() {
            localStorage.removeItem('ccg_user');
            currentUser = null;
            switchTab('auth');
            updateUI();
        }

        // --- DỮ LIỆU ---
        async function fetchData() {
            const res = await apiCall('get_data', { username: currentUser.username });
            if(res && res.success) {
                allTasks = res.tasks;
                myHistory = res.history;
                
                // Giả lập nhiệm vụ hệ thống nếu sheet trống
                if(allTasks.length === 0) {
                    allTasks.push({id: "sys1", type: "vuot_link", url: "Link hệ thống 1", reward: 2});
                    allTasks.push({id: "sys2", type: "vuot_link", url: "Link hệ thống 2", reward: 3});
                }
                
                filterTasks(currentTaskType);
                renderHistory();
            }
        }

        function filterTasks(type) {
            currentTaskType = type;
            document.getElementById('btn-type-vuot').className = type === 'vuot_link' ? "text-cyan-400 font-bold text-lg px-2" : "text-gray-500 font-bold text-lg px-2 hover:text-gray-300";
            document.getElementById('btn-type-cheo').className = type === 'cheo_link' ? "text-cyan-400 font-bold text-lg px-2" : "text-gray-500 font-bold text-lg px-2 hover:text-gray-300";
            
            const list = document.getElementById('tasks-container');
            const filtered = allTasks.filter(t => t.type === type);
            
            if(filtered.length === 0) {
                list.innerHTML = `<div class="col-span-full text-center text-gray-500 py-8">Chưa có nhiệm vụ nào.</div>`;
                return;
            }

            list.innerHTML = filtered.map(t => `
                <div class="bg-gray-900 border border-gray-800 rounded-xl p-5 flex flex-col justify-between">
                    <div class="mb-4">
                        <div class="text-xs text-gray-500 mb-1">${t.type === 'cheo_link' ? 'Đăng bởi: ' + t.creator : 'Nhiệm vụ hệ thống'}</div>
                        <div class="truncate text-sm text-cyan-400">${t.url}</div>
                    </div>
                    <div class="flex justify-between items-center mb-4">
                        <span class="bg-yellow-500/20 text-yellow-400 px-3 py-1 rounded-md text-xs font-bold">+${t.reward} ⚡</span>
                        ${t.type === 'cheo_link' ? `<span class="text-xs text-gray-400">Đã chéo: ${t.current}/${t.target}</span>` : ''}
                    </div>
                    <button onclick="submitTask('${t.id}')" class="w-full bg-white text-black font-bold py-2 rounded-lg hover:bg-gray-200">
                        Làm Nhiệm Vụ
                    </button>
                </div>
            `).join('');
        }

        // --- HÀNH ĐỘNG ---
        function calcCost() {
            const v = document.getElementById('post-views').value;
            const cost = v * 2; // 2 Chém / lượt
            document.getElementById('post-total').innerText = `- ${cost} ⚡`;
        }

        async function postTask() {
            const url = document.getElementById('post-url').value;
            const views = document.getElementById('post-views').value;
            const cost = views * 2;
            
            if(!url) return showToast("Nhập link!", "error");
            if(cost > currentUser.chem) return showToast("Không đủ Chém!", "error");

            const btn = document.getElementById('btn-post-task');
            btn.innerHTML = `<span class="loader"></span> Đang xử lý...`;
            
            const res = await apiCall('post_task', { username: currentUser.username, url, views, costPerView: 2, totalCost: cost });
            if(res && res.success) {
                showToast("Đăng link thành công!");
                currentUser.chem = res.newChem;
                localStorage.setItem('ccg_user', JSON.stringify(currentUser));
                updateUI();
                document.getElementById('post-url').value = '';
                fetchData();
            } else {
                showToast(res.message, "error");
            }
            btn.innerHTML = `Thanh toán & Đăng`;
        }

        async function submitTask(taskId) {
            showToast("Đang gửi yêu cầu xác duyệt...");
            const res = await apiCall('submit_task', { username: currentUser.username, taskId });
            if(res && res.success) {
                showToast(res.message);
                fetchData(); // Load lại để update lịch sử
                switchTab('profile'); // Nhảy sang tab lịch sử để xem trạng thái chờ duyệt
            }
        }

        function renderHistory() {
            const boxDone = document.getElementById('history-done');
            const boxPost = document.getElementById('history-post');
            
            const doneList = myHistory.filter(h => h.action === 'lam_nhiem_vu');
            const postList = myHistory.filter(h => h.action === 'dang_link');

            const statusHTML = (s) => s === 'pending' 
                ? `<span class="text-xs font-bold text-yellow-500 bg-yellow-500/10 px-2 py-1 rounded">Chờ duyệt</span>`
                : `<span class="text-xs font-bold text-green-500 bg-green-500/10 px-2 py-1 rounded">Hoàn thành</span>`;

            boxDone.innerHTML = doneList.length === 0 ? '<p class="text-gray-600 text-sm">Chưa làm nhiệm vụ nào.</p>' : doneList.reverse().map(h => `
                <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 flex justify-between items-center">
                    <div><div class="text-xs text-gray-500">${h.time}</div><div class="text-sm truncate w-40 text-gray-300">ID: ${h.target}</div></div>
                    ${statusHTML(h.status)}
                </div>
            `).join('');

            boxPost.innerHTML = postList.length === 0 ? '<p class="text-gray-600 text-sm">Chưa đăng link nào.</p>' : postList.reverse().map(h => `
                <div class="bg-gray-950 p-3 rounded-lg border border-gray-800 flex justify-between items-center">
                    <div><div class="text-xs text-gray-500">${h.time}</div><div class="text-sm truncate w-40 text-purple-400">${h.target}</div></div>
                    <i class="fa-solid fa-check-circle text-green-500"></i>
                </div>
            `).join('');
        }
    </script>
</body>
</html>
